name: matrix

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target (e.g. rust-lang/rust/static-lifetime-bound)'
        required: true
      os:
        description: 'OS (x86_64-linux, aarch64-linux, x86_64-darwin, aarch64-darwin, or all)'
        default: 'all'

jobs:
  x86_64-linux:
    if: ${{ inputs.os == 'all' || inputs.os == 'x86_64-linux' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh ./runner ${{ inputs.target }}

  aarch64-linux:
    if: ${{ inputs.os == 'all' || inputs.os == 'aarch64-linux' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: sh ./runner ${{ inputs.target }}

  x86_64-darwin:
    if: ${{ inputs.os == 'all' || inputs.os == 'x86_64-darwin' }}
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - run: sh ./runner ${{ inputs.target }}

  aarch64-darwin:
    if: ${{ inputs.os == 'all' || inputs.os == 'aarch64-darwin' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh ./runner ${{ inputs.target }}
